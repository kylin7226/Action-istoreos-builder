name: Build rkmpp/rkrga/ffmpeg-mpp APKs

# ─────────────────────────────────────────────────────────────
# 用 iStoreOS 25.12 源码 + jjm2473/openwrt-rkmpp feed 交叉编译 RK3588
# 多媒体用户态库，产出 aarch64_generic(musl) 的 .apk：
#   rkmpp        librockchip_mpp（VPU 用户态库，配 kmod-rk_vcodec）
#   rkrga        librga（RGA 2D 加速用户态库，配 kmod-rga3）
#   libffmpeg-mpp / ffmpeg-mpp / ffprobe-mpp   带 MPP+RGA 硬件加速的 ffmpeg
#   rkmpp-demo / rkrga-demo   自测小程序
#
# 为什么在这里编译：官方 ImageBuilder、dllkids feed、ImmortalWrt 仓库都
# 没有这些用户态库的现成 .apk，只能从源码编译。本地机器编译会卡在
# savannah/sourceforge/openbsd 等境外下载源（GFW 限速），GitHub runner
# 网络无此问题。所有 feed 包的上游源码都在 GitHub（JeffyCN/mirrors、
# jjm2473/librga、jjm2473/ffmpeg-rk），runner 下载顺畅。
#
# 编译成功后把 .apk 上传到本仓库的 GitHub Release（固定 tag: rkmpp-apk，滚动
# 更新），二进制不进 git 树，方便后续直接复用。build.yml 构建固件时从该
# Release 拉取 .apk 放进 IB 的 packages/，IB 自动 apk mkndx --allow-untrusted
# 重建索引，无需签名。运行时包名由本 workflow 追加进 recipe/packages-add.txt。
#
# 触发方式：改动本文件时自动 push 触发，或在 Actions 页面手动 Run workflow。
# ─────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      commit_to_repo:
        description: '编译成功后把运行时包名追加进 recipe/packages-add.txt（.apk 一律上传到 Release rkmpp-apk）'
        required: false
        default: true
        type: boolean
  push:
    branches: [main, master]
    paths:
      # 只在改本 workflow 时触发（一次 ~2h 的编译），改 recipe/files 不会触发
      - '.github/workflows/build-rkmpp.yml'

permissions:
  contents: write   # 创建/上传 Release + 提交 packages-add.txt
  actions: write    # 编译完成后显式 dispatch build.yml 重建固件

concurrency:
  group: build-rkmpp
  cancel-in-progress: true   # 推新版本时取消正在跑的旧 run（避免旧逻辑污染仓库）

env:
  SRC_REPO: https://github.com/istoreos/istoreos.git
  SRC_BRANCH: istoreos-25.12
  RKMPP_FEED: https://github.com/jjm2473/openwrt-rkmpp.git
  DEVICE: cyber_cyber3588-aib
  # 固件里要装的运行时包（demo 只编译不装）
  RUNTIME_PKGS: rkmpp rkrga libffmpeg-mpp ffmpeg-mpp ffprobe-mpp

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo apt-get clean || true
          df -h /

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc gettext \
            libncurses-dev zlib1g-dev libssl-dev libelf-dev \
            xsltproc rsync wget curl git file unzip tar zstd xz-utils ccache \
            python3 python3-setuptools python3-pyelftools swig cmake \
            pkg-config device-tree-compiler
          echo "----- host tool versions -----"
          gcc --version | head -1
          cmake --version | head -1
          swig -version | grep Version
          python3 -c 'import elftools; print("pyelftools", elftools.__version__)'

      - name: Clone iStoreOS source (${{ env.SRC_BRANCH }})
        run: |
          # 克隆到 workspace 下的固定路径 openwrt/（而非 runner.temp 的随机路径），
          # 因为 buildroot 会把 SRC 的绝对路径写进 toolchain 的 RPATH/配置里；路径
          # 稳定后，下面 actions/cache 恢复的 toolchain 才能直接复用，省掉 ~48min 重建。
          cd "${{ github.workspace }}"
          git clone --depth 1 --branch "$SRC_BRANCH" "$SRC_REPO" openwrt
          cd openwrt
          echo "SRC=$PWD" >> "$GITHUB_ENV"
          echo "源码 commit: $(git rev-parse --short HEAD)  ($(git log -1 --format=%cd))"
          git config --global --add safe.directory "$PWD"

      - name: Add rkmpp feed to feeds.conf
        run: |
          cd "$SRC"
          # feeds.conf 不存在时 ./scripts/feeds 读 feeds.conf.default
          cp -n feeds.conf.default feeds.conf 2>/dev/null || true
          # 幂等追加 rkmpp feed
          grep -q 'rkmpp' feeds.conf || echo "src-git rkmpp $RKMPP_FEED" >> feeds.conf
          echo "----- feeds.conf -----"
          cat feeds.conf

      - name: Update & install feeds
        run: |
          cd "$SRC"
          # 只更新需要的 feed：packages（依赖库）+ rkmpp（目标包），省时
          ./scripts/feeds update packages rkmpp
          # -a 全量安装（只建符号链接，不编译），确保所有传递依赖都能被 defconfig 解析，
          # 避免因单个依赖包名写错导致 2 小时后才在链接阶段失败。
          ./scripts/feeds install -a -p rkmpp
          ./scripts/feeds install -a -p packages
          echo "----- 确认目标包已接入 -----"
          ls -l package/feeds/rkmpp/

      - name: Write .config
        run: |
          cd "$SRC"
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_cyber_cyber3588-aib=y
          # ffmpeg-mpp 里含 x264/aac 等专利编解码，必须开 BUILD_PATENTED 才会出现
          CONFIG_BUILD_PATENTED=y
          # 千万不要设 CONFIG_ALL —— ffmpeg-mpp 有 depends on !ALL，会被隐藏
          CONFIG_PACKAGE_rkmpp=m
          CONFIG_PACKAGE_rkmpp-demo=m
          CONFIG_PACKAGE_rkrga=m
          CONFIG_PACKAGE_rkrga-demo=m
          CONFIG_PACKAGE_ffmpeg-mpp=m
          CONFIG_PACKAGE_ffprobe-mpp=m
          CONFIG_PACKAGE_libffmpeg-mpp=m
          EOF
          make defconfig
          echo "----- 选中情况 -----"
          grep -E 'CONFIG_PACKAGE_(rkmpp|rkrga|ffmpeg-mpp|ffprobe-mpp|libffmpeg-mpp)(-demo)?=' .config || true

      - name: Verify packages selected (fail fast)
        run: |
          cd "$SRC"
          # 运行时必需的 5 个包，缺任何一个都直接失败
          MISSING=""
          for p in rkmpp rkrga ffmpeg-mpp ffprobe-mpp libffmpeg-mpp; do
            if grep -qE "CONFIG_PACKAGE_$p=[ym]" .config; then
              echo "  ✅ $p"
            else
              echo "  ❌ $p 未被选中（defconfig 丢弃了它）"
              MISSING="$MISSING $p"
            fi
          done
          # demo 只是自测工具，缺了不致命，仅提示
          for p in rkmpp-demo rkrga-demo; do
            grep -qE "CONFIG_PACKAGE_$p=[ym]" .config && echo "  ✅ $p" || echo "  ⚠️  $p 未选中（不影响固件）"
          done
          if [ -n "$MISSING" ]; then
            echo "❌ 以下必需包没进 .config：$MISSING"
            echo "   常见原因：feed 没装成功 / BUILD_PATENTED 未开 / 误设了 CONFIG_ALL"
            exit 1
          fi

      - name: Prereq check
        run: |
          set -o pipefail
          cd "$SRC"
          make -j1 prereq V=s 2>&1 | tail -60

      - name: Cache toolchain & build dirs
        id: tc-cache
        uses: actions/cache@v4
        with:
          # 缓存交叉工具链和已下载源码，命中后可跳过 ~48min 的 toolchain/install。
          # 路径都在固定的 $SRC(=workspace/openwrt) 下，绝对路径稳定，RPATH 不会失效。
          path: |
            ${{ github.workspace }}/openwrt/staging_dir/toolchain-*
            ${{ github.workspace }}/openwrt/build_dir/toolchain-*
            ${{ github.workspace }}/openwrt/dl
            ${{ github.workspace }}/openwrt/staging_dir/host
            ${{ github.workspace }}/openwrt/build_dir/host
          key: tc-${{ runner.os }}-${{ hashFiles(format('{0}/.config', github.workspace)) }}-${{ env.SRC_BRANCH }}
          restore-keys: |
            tc-${{ runner.os }}-

      - name: Build toolchain
        run: |
          cd "$SRC"
          # 交叉编译 aarch64 包前必须先有 toolchain（含 tools/，会下载 gnulib/
          # libressl 等 —— 这些在本地被 GFW 卡死，runner 上正常）
          make -j"$(nproc)" toolchain/install

      - name: Compile rkmpp / rkrga / ffmpeg-mpp packages
        run: |
          cd "$SRC"
          # 定向编译三个 feed 目录即可产出全部 7 个 .apk。已核对 buildroot 的
          # tmp/.packagedeps：ffmpeg-mpp/compile 的前置包含 fdk-aac/gnutls/libdrm/
          # libx264/opus/rkmpp/rkrga/zlib/bzip2/lame(+alsa-lib)，gnutls 又拉起
          # nettle/gmp/libtasn1/p11-kit，所以依赖闭包会被自动构建，且不会去碰
          # busybox/kmod 等默认包（那些需要内核，会拖慢甚至失败）。
          LOG="$RUNNER_TEMP/compile.log"
          set +e
          # stdbuf -oL 关闭 stdout 块缓冲：否则 `2>&1 | tee` 会把 stderr 的
          # "*** Error" 级联先刷出、stdout 的 V=s 命令回显后刷出，日志乱序，
          # tail 只看到最后成功的包而看不到真正报错。行缓冲后顺序正确。
          stdbuf -oL -eL make -j"$(nproc)" V=s \
            package/feeds/rkmpp/rkmpp/compile \
            package/feeds/rkmpp/rkrga/compile \
            package/feeds/rkmpp/ffmpeg-mpp/compile 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "===== 编译失败 rc=$rc ====="
            mkdir -p "${{ github.workspace }}/rkmpp-logs"
            cp -v "$LOG" "${{ github.workspace }}/rkmpp-logs/compile.log"
            # 全日志搜错误（不靠 tail，避免缓冲乱序漏掉）。先找 buildroot 的
            # "*** [package/.../compile] Error" 级联定位失败的包，再打印它前面
            # 60 行真正的编译/configure 报错上下文。
            echo "----- 失败的 package 目标 -----"; grep -nE "\*\*\* \[package/" "$LOG" | tail -20
            FAILLINE=$(grep -nE "\*\*\* \[package/" "$LOG" | head -1 | cut -d: -f1)
            if [ -n "$FAILLINE" ]; then
              S=$(( FAILLINE > 70 ? FAILLINE - 70 : 1 ))
              echo "----- 失败点上下文（行 $S..$FAILLINE）-----"
              sed -n "${S},${FAILLINE}p" "$LOG"
            fi
            echo "----- 其它错误关键字 -----"; grep -nE ": error:|fatal error|configure: error|No rule to make target|cannot find -l|undefined reference|collect2|Package .* not found|error: " "$LOG" | tail -25
            # annotation 有数量上限，只发最关键的：失败的 package 目标 + 编译错误行
            { grep -E "\*\*\* \[package/" "$LOG" | tail -3
              grep -E ": error:|fatal error|configure: error|No rule to make target|cannot find -l|undefined reference|collect2|Package .* not found" "$LOG" | tail -8; } \
              | sed 's/%/%25/g; s/\r/%0D/g' | while IFS= read -r l; do
                  [ -n "$l" ] && printf '::error::%s\n' "$l"
                done
            exit "$rc"
          fi
          echo "✅ 编译成功"

      - name: Upload compile log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rkmpp-compile-log
          path: rkmpp-logs/
          retention-days: 14

      - name: Collect .apk artifacts
        run: |
          cd "$SRC"
          OUT="${{ github.workspace }}/rkmpp-apk"
          mkdir -p "$OUT"
          # rkmpp feed 的包输出到 bin/packages/<arch>/rkmpp/；用 find 收集，
          # 不写死 arch 目录名，避免 aarch64_generic / cortex-a76 之类差异
          echo "----- bin/packages 下所有 rkmpp feed 的 .apk -----"
          find bin/packages -path '*/rkmpp/*.apk' -print
          find bin/packages -path '*/rkmpp/*.apk' -exec cp -v {} "$OUT/" \;
          echo "----- 收集结果 -----"
          ls -lh "$OUT"
          N=$(find "$OUT" -name '*.apk' | wc -l)
          echo "共 $N 个 .apk"
          if [ "$N" -lt 5 ]; then
            echo "❌ .apk 数量不足（期望 ≥5：rkmpp/rkrga/libffmpeg-mpp/ffmpeg-mpp/ffprobe-mpp）"
            exit 1
          fi

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: rkmpp-apk-aarch64_generic
          path: rkmpp-apk/
          retention-days: 30

      - name: Publish APKs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${{ github.workspace }}"
          TAG=rkmpp-apk
          # 固定 tag 的滚动 Release：编译产物只存 Release，不进 git 树，方便后续直接复用。
          if ! gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" -R "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "RK3588 多媒体用户态库 APK（aarch64_generic / musl）" \
              --notes "由 build-rkmpp.yml 从 iStoreOS ${SRC_BRANCH} 源码 + jjm2473/openwrt-rkmpp feed 交叉编译。build.yml 构建固件时从此 Release 拉取 .apk 注入 ImageBuilder。"
            echo "已创建 Release $TAG"
          else
            echo "Release $TAG 已存在，滚动更新资产"
          fi
          # --clobber 覆盖同名旧资产
          gh release upload "$TAG" rkmpp-apk/*.apk -R "${{ github.repository }}" --clobber
          echo "----- Release $TAG 资产 -----"
          gh release view "$TAG" -R "${{ github.repository }}"

      - name: Add rkmpp to packages-add.txt (text only)
        if: ${{ inputs.commit_to_repo != false }}
        run: |
          cd "${{ github.workspace }}"
          # 只改这个文本文件（告诉 build.yml 固件里要装哪些 rkmpp 包）；
          # .apk 二进制在 Release 里，不进 git 树。
          ADDFILE="recipe/packages-add.txt"
          if ! grep -q 'RKMPP-MANAGED-BLOCK' "$ADDFILE"; then
            {
              echo ""
              echo "# ── RKMPP-MANAGED-BLOCK ────────────────────────────────"
              echo "# RK3588 多媒体用户态库，由 build-rkmpp.yml 从源码编译，.apk 存于"
              echo "# GitHub Release（tag: rkmpp-apk），build.yml 构建时拉取注入 IB。"
              echo "# 下面几行由该 workflow 自动维护。"
            } >> "$ADDFILE"
          fi
          for p in $RUNTIME_PKGS; do
            grep -qx "$p" "$ADDFILE" || echo "$p" >> "$ADDFILE"
          done
          echo "----- packages-add.txt 末尾 -----"
          tail -12 "$ADDFILE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add recipe/packages-add.txt
          if git diff --cached --quiet; then
            echo "packages-add.txt 无变化，跳过提交"
          else
            git commit -m "rkmpp: 运行时包名加入固件（.apk 存于 Release rkmpp-apk）" -m "由 build-rkmpp.yml run #${{ github.run_number }} 编译并上传到 Release。本 commit 只改 packages-add.txt，二进制不进 git 树。"
            git pull --rebase origin main
            git push origin HEAD
            echo "✅ packages-add.txt 已更新"
          fi

      - name: Trigger firmware rebuild (build.yml)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 用 GITHUB_TOKEN 推送的 commit 不会触发其它 workflow（GitHub 防递归），
          # 所以显式 workflow_dispatch 触发 build.yml，让它从 Release rkmpp-apk
          # 拉取 .apk 注入 IB、重建带 rkmpp 的固件。
          curl -sSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}","inputs":{"lan_ip":"192.168.199.1","rootfs_partsize":"4096","with_gui_extras":true,"include_docker":true}}' \
            -w '\nHTTP %{http_code}\n'
          echo "✅ 已请求触发 build.yml，去 Actions 页面查看固件重建进度"
