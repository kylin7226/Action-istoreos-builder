name: Build iStoreOS for Cyber3588-AIB

on:
  workflow_dispatch:
    inputs:
      lan_ip:
        description: '全新刷写的 LAN IPv4 地址（默认 /24；保留配置升级不覆盖）'
        required: true
        default: '192.168.199.1'
      rootfs_partsize:
        description: '镜像 rootfs 分区大小，512–32768 MB；实际磁盘扩容由系统处理'
        required: true
        default: '4096'
      with_gui_extras:
        description: 'iStore / 软件包管理 / ttyd / UPnP / argon'
        type: boolean
        default: true
      include_docker:
        description: 'Docker + dockerman'
        type: boolean
        default: true
      include_samwaf:
        description: 'SamWaf + LuCI 管理页'
        type: boolean
        default: true
  push:
    branches: [main, master]
    paths: ['recipe/**', 'files/**', 'scripts/**', 'tests/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['recipe/**', 'files/**', 'scripts/**', 'tests/**', '.github/workflows/build.yml']
  schedule:
    - cron: '23 3 * * *'

concurrency:
  group: firmware-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IB_BASE: https://fw.koolcenter.com/iStoreOS/ib/rk3xxx
  IB_FILE: istoreos-imagebuilder-rockchip-armv8.Linux-x86_64.tar.zst
  PROFILE: cyber_cyber3588-aib
  SAMWAF_VERSION: v1.3.24

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/samwaf.test.js

  check-upstream:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL --retry 5 --max-time 120 "$IB_BASE/sha256sums" -o "$RUNNER_TEMP/sha256sums"
          UP=$(awk -v file="$IB_FILE" '$2 == file || $2 == "*" file { print $1 }' "$RUNNER_TEMP/sha256sums")
          [[ "$UP" =~ ^[0-9a-f]{64}$ ]]
          LAST=''
          if gh release download firmware -R "$GITHUB_REPOSITORY" --pattern ib-source-sha256.txt --dir "$RUNNER_TEMP/last"; then
            LAST=$(tr -d '[:space:]' < "$RUNNER_TEMP/last/ib-source-sha256.txt")
          fi
          if [ "$UP" = "$LAST" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [test, check-upstream]
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event_name != 'pull_request' && (github.event_name != 'schedule' || needs.check-upstream.outputs.changed == 'true') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate inputs and prepare package list and overlay
        env:
          LAN_IP: ${{ inputs.lan_ip }}
          ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize }}
          WITH_GUI_EXTRAS: ${{ inputs.with_gui_extras }}
          INCLUDE_DOCKER: ${{ inputs.include_docker }}
          INCLUDE_SAMWAF: ${{ inputs.include_samwaf }}
        run: python3 scripts/build-support.py configure
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gawk libncurses-dev zlib1g-dev git gettext libssl-dev xsltproc rsync wget curl file unzip tar zstd xz-utils python3 python3-setuptools openssl
      - name: Download and verify ImageBuilder
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 5 --max-time 1800 -o "$IB_FILE" "$IB_BASE/$IB_FILE"
          curl -fL --retry 3 --max-time 120 -o sha256sums "$IB_BASE/sha256sums"
          IB_SHA=$(awk -v file="$IB_FILE" '$2 == file || $2 == "*" file { print $1 }' sha256sums)
          [[ "$IB_SHA" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$IB_SHA" "$IB_FILE" | sha256sum -c -
          printf '%s  %s\n' "$IB_SHA" "$IB_FILE" > source-checksums.txt
          echo "IB_SHA=$IB_SHA" >> "$GITHUB_ENV"
          tar --zstd -xf "$IB_FILE"
          dirs=("$RUNNER_TEMP"/istoreos-imagebuilder-*/)
          [ "${#dirs[@]}" = 1 ] && [ -d "${dirs[0]}" ]
          echo "IB_DIR=${dirs[0]%/}" >> "$GITHUB_ENV"
      - name: Check profile and fetch signed third-party packages
        run: |
          cd "$IB_DIR"
          make info > "$RUNNER_TEMP/ib-info.txt" 2>&1
          grep -q "^${PROFILE}:" "$RUNNER_TEMP/ib-info.txt"
          APK="$IB_DIR/staging_dir/host/bin/apk"
          mkdir -p "$RUNNER_TEMP/feed-packages" "$RUNNER_TEMP/apk-root"
          mapfile -t requested < <(python3 - "$RUNNER_TEMP/build-config.json" <<'PY'
          import json, sys
          supported = {'ddns-go', 'luci-app-ddns-go', 'frpc', 'frps', 'luci-app-frpc', 'luci-app-frps', 'luci-app-mosdns', 'geo2txt', 'v2ray-geoip', 'v2ray-geosite'}
          print('\n'.join(sorted(set(json.load(open(sys.argv[1]))['required']) & supported)))
          PY
          )
          if [ -n "${requested[0]:-}" ]; then
            "$APK" --root "$RUNNER_TEMP/apk-root" --arch aarch64_generic \
              --keys-dir "$GITHUB_WORKSPACE/files/etc/apk/keys" \
              --repositories-file "$GITHUB_WORKSPACE/files/etc/apk/repositories.d/dllkids-feed.list" \
              --cache=no fetch --output "$RUNNER_TEMP/feed-packages" "${requested[@]}"
            for package in "$RUNNER_TEMP/feed-packages/"*.apk; do
              sha256sum "$package" | sed "s|$RUNNER_TEMP/feed-packages/||" >> "$RUNNER_TEMP/source-checksums.txt"
              cp "$package" packages/
            done
          fi
      - name: Install verified SamWaf binary
        run: |
          if [ "$INCLUDE_SAMWAF" = false ]; then exit 0; fi
          WORK="$RUNNER_TEMP/samwaf-download"
          mkdir -p "$WORK"
          cd "$WORK"
          NUM="${SAMWAF_VERSION#v}"
          TARBALL="SamWaf_Linux_arm64.${SAMWAF_VERSION}.tar.gz"
          BASE="https://github.com/samwafgo/SamWaf/releases/download/$SAMWAF_VERSION"
          curl -fL --retry 5 --max-time 600 -o "$TARBALL" "$BASE/$TARBALL"
          curl -fL --retry 3 --max-time 120 -o checksums.txt "$BASE/SamWaf_${NUM}_checksums.txt"
          WANT=$(awk '/Linux_arm64/ {print $1}' checksums.txt)
          [[ "$WANT" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$WANT" "$TARBALL" | sha256sum -c -
          printf '%s  %s\n' "$WANT" "$TARBALL" >> "$RUNNER_TEMP/source-checksums.txt"
          python3 "$GITHUB_WORKSPACE/scripts/extract-samwaf.py" "$TARBALL" samwaf
          file samwaf | grep -q 'ARM aarch64'
          file samwaf | grep -q 'statically linked'
          FILES="$RUNNER_TEMP/files-overlay"
          install -Dm755 samwaf "$FILES/usr/bin/samwaf"
          install -d "$FILES/usr/share/samwaf"
          printf '%s\n' "$SAMWAF_VERSION" > "$FILES/usr/share/samwaf/VERSION"
          test -x "$FILES/etc/init.d/samwaf"
          test -x "$FILES/etc/uci-defaults/99-samwaf"
          test -x "$FILES/usr/libexec/samwafctl"
      - name: Build image
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          cd "$IB_DIR"
          set +e
          stdbuf -oL -eL make -j"$(nproc)" image PROFILE="$PROFILE" PACKAGES="$PACKAGES" \
            FILES="$RUNNER_TEMP/files-overlay" ROOTFS_PARTSIZE="$ROOTFS_PARTSIZE" \
            CONFIG_TARGET_ROOTFS_PARTSIZE="$ROOTFS_PARTSIZE" 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/build-image.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            err=$(grep -aE 'ERROR|error:|unable to|conflict|no such package|Cannot' "$GITHUB_WORKSPACE/build-logs/build-image.log" | tail -n 20)
            [ -n "$err" ] || err=$(tail -n 30 "$GITHUB_WORKSPACE/build-logs/build-image.log")
            echo "::error::make image failed (exit $rc): ${err//$'\n'/%0A}"
            exit "$rc"
          fi
      - name: Verify and collect exact release assets
        run: |
          set +e
          msg=$(python3 scripts/build-support.py collect 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$msg"
          if [ "$rc" -ne 0 ]; then
            echo "::error::collect failed: ${msg//$'\n'/%0A}"
            ls -la "$IB_DIR/build_dir" "$IB_DIR/bin/targets/rockchip/armv8" || true
            exit "$rc"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-image-log
          path: build-logs/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: istoreos-${{ env.PROFILE }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Publish dated and rolling releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish.sh
